name: Build SlashServer
run-name: Build SlashServer jar

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build

      - name: Release
        uses: https://git.lipovcan.cz/Upstream/gitea-release-action.git@v1
        with:
          tag_name: "3.5.0-SNAPSHOT"
          files: |-
            build/libs/slashserver-*.jar
